components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: 登录后由服务端设置的会话 Cookie。
    bearerAuth:
      type: http
      scheme: bearer
      description: 部署环境提供的 Bearer Token。
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 资源 ID。
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
      description: Project ID。
    PeId:
      name: pe_id
      in: path
      required: true
      schema: { type: string }
      description: Project 文件夹资源 ID。
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Conversation ID。
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
      description: 消息 ID。
    CallId:
      name: callId
      in: path
      required: true
      schema: { type: string }
      description: 工具调用或确认请求 ID。
    OptionId:
      name: option_id
      in: path
      required: true
      schema: { type: string }
      description: ACP config option ID，例如 mode 或 model。
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
      description: 页码。
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200 }
      description: 每页数量。
    Query:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: 搜索或过滤文本。
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: 分页游标。
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          example: {}
    Empty:
      required: false
      content: {}
    MultipartFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary, description: 要上传的文件 }
              file_name: { type: string, description: 原始文件名 }
              conversation_id: { type: string, description: 关联 Conversation ID }
  responses:
    Success:
      description: 请求成功。具体 data 结构由接口业务类型决定。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Error:
      description: 请求失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiResponse:
      type: object
      description: AionCore 通用成功响应包装。
      properties:
        success: { type: boolean, description: 是否成功 }
        data: { description: 业务响应数据 }
        message: { type: string, nullable: true, description: 可选提示信息 }
      required: [success]
    ErrorResponse:
      type: object
      description: AionCore 通用错误响应。
      properties:
        success: { type: boolean, example: false }
        error: { type: string, description: 错误信息 }
        code: { type: string, description: 稳定错误代码 }
        details: { description: 可选错误详情 }
      required: [success, error, code]
    ConversationList:
      type: object
      description: Conversation 分页结果。
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer, format: int64 }
        has_more: { type: boolean }
      required: [items, total, has_more]
    AcpConfigOption:
      type: object
      description: Agent 声明的 ACP 会话配置项。
      properties:
        id: { type: string, description: 配置项 ID }
        label: { type: string, nullable: true, description: 显示名称 }
        category: { type: string, nullable: true, description: 配置类别，例如 mode 或 model }
        type: { type: string, description: 配置控件类型 }
        current_value: { type: string, nullable: true, description: 当前值 }
        options: { type: array, items: { type: object }, description: 可选值列表 }
      required: [id, type]
