openapi: 3.1.0
info:
  title: AionCore API
  version: 0.1.67
  description: |
    AionCore 后端 HTTP API 文档。

    说明：
    - 除公开认证、健康检查、静态资源和 WebSocket 握手接口外，API 默认需要认证。
    - 具体认证方式由部署配置决定，通常使用 Cookie 会话或 Bearer Token。
    - 请求体和响应体中的业务对象会随 agent、插件和运行时能力变化；未在本文件中固定的对象使用兼容性对象描述。
    - 所有接口统一使用 ApiResponse<T> 或 ErrorResponse 风格的响应包装。
servers:
  - url: http://127.0.0.1:25808
    description: 本地默认服务地址
  - url: /
    description: 当前部署地址
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: 健康检查
    description: 服务存活和健康状态。
  - name: 认证
    description: 登录、会话、用户和密码管理。
  - name: Project
    description: Project 和工作区文件夹管理。
  - name: Conversation
    description: 对话、消息、运行时和确认操作。
  - name: ACP 会话
    description: ACP agent 的 Session Mode、模型、配置项和命令。
  - name: 文件系统
    description: 文件上传、读取、写入、复制和版本快照操作。
  - name: Provider
    description: 模型 Provider 管理。
  - name: MCP
    description: MCP 服务器和 OAuth 管理。
  - name: Agent
    description: ACP agent 发现、管理和连接测试。
  - name: Assistant
    description: Assistant 配置管理。
  - name: Channel
    description: Telegram、Lark、DingTalk、WeChat、Slack 和 Discord 渠道。
  - name: Team
    description: Team、成员、任务、消息和运行控制。
  - name: Cron
    description: 定时任务和 Conversation Cron。
  - name: Extension
    description: 扩展、主题、技能和插件查询及管理。
  - name: Office
    description: Word、Excel、PPT 预览和文档转换。
  - name: Shell
    description: 系统打开文件、打开目录和语音转文字。
  - name: 系统设置
    description: 系统设置、版本检查和诊断。
paths:
  /health:
    get:
      tags: [健康检查]
      summary: 健康检查
      description: 返回服务状态、版本和构建时间。
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /ws:
    get:
      tags: [健康检查]
      summary: WebSocket 事件连接
      description: 升级为 WebSocket，接收实时业务事件。具体消息格式为 name 和 data。
      security: []
      responses:
        '101': { description: WebSocket 升级成功 }
  /login:
    post:
      tags: [认证]
      summary: 登录
      description: 使用用户名和密码创建登录会话。
      security: []
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /logout:
    post:
      tags: [认证]
      summary: 登出
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/status:
    get:
      tags: [认证]
      summary: 查询认证状态
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/user:
    get:
      tags: [认证]
      summary: 获取当前用户
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/qr-login:
    post:
      tags: [认证]
      summary: 二维码登录
      security: []
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/refresh:
    post:
      tags: [认证]
      summary: 刷新认证令牌
      security: []
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/change-password:
    post:
      tags: [认证]
      summary: 修改当前用户密码
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/internal/users:
    get:
      tags: [认证]
      summary: 列出内部用户
      description: 内部管理接口，需部署权限。
      requestBody: { $ref: '#/components/requestBodies/Empty' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [认证]
      summary: 创建内部用户
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/projects:
    get:
      tags: [Project]
      summary: 获取全部 Project
      description: 返回当前用户可访问的 Project 列表。
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/projects/{project_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Project]
      summary: 获取 Project 详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/projects/{project_id}/folders:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Project]
      summary: 为 Project 添加文件夹
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/projects/{project_id}/folders/{pe_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/PeId' }
    delete:
      tags: [Project]
      summary: 移除 Project 文件夹
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/projects/{project_id}/resolve-ref:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Project]
      summary: 解析 Project 资源引用
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations:
    get:
      tags: [Conversation]
      summary: 获取 Conversation 列表
      description: 返回分页对话列表，支持查询参数过滤和分页。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Query' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Conversation]
      summary: 创建 Conversation
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      tags: [Conversation]
      summary: 获取 Conversation 详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      tags: [Conversation]
      summary: 更新 Conversation
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Conversation]
      summary: 删除 Conversation
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      tags: [Conversation]
      summary: 获取消息列表
      parameters: [{ $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Conversation]
      summary: 发送消息
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/messages/{messageId}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { $ref: '#/components/parameters/MessageId' }
    get:
      tags: [Conversation]
      summary: 获取单条消息
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/reset:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    post:
      tags: [Conversation]
      summary: 重置 Conversation
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/fork:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    post:
      tags: [Conversation]
      summary: Fork Conversation
      description: 从指定消息位置创建新的 Conversation 分支。
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    post:
      tags: [Conversation]
      summary: 取消当前 turn
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/runtime/ensure:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    post:
      tags: [ACP 会话]
      summary: 确保 Conversation runtime 存在
      description: 启动或恢复 agent runtime，并返回 config options。
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/config-options/{option_id}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { $ref: '#/components/parameters/OptionId' }
    put:
      tags: [ACP 会话]
      summary: 设置 ACP config option
      description: 修改模型、Session Mode、推理等级或 agent 自定义配置。pending_next_turn 表示下一轮生效。
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/slash-commands:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      tags: [ACP 会话]
      summary: 获取当前 agent 的 Slash Commands
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/confirmations:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      tags: [Conversation]
      summary: 获取待确认请求
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/conversations/{id}/confirmations/{callId}/confirm:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { $ref: '#/components/parameters/CallId' }
    post:
      tags: [Conversation]
      summary: 确认工具调用
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/upload:
    post:
      tags: [文件系统]
      summary: 上传文件
      description: 上传文件到后端受控上传目录。默认大小限制为 30 MB。
      requestBody: { $ref: '#/components/requestBodies/MultipartFile' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/list:
    post:
      tags: [文件系统]
      summary: 列出工作区文件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/read:
    post:
      tags: [文件系统]
      summary: 读取文件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/write:
    post:
      tags: [文件系统]
      summary: 写入文件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/copy:
    post:
      tags: [文件系统]
      summary: 复制文件或目录
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/reveal:
    post:
      tags: [文件系统]
      summary: 在系统文件管理器中显示项目
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/open-system:
    post:
      tags: [文件系统]
      summary: 使用系统程序打开文件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/copy-absolute-path:
    post:
      tags: [文件系统]
      summary: 复制资源绝对路径到剪贴板
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/fs/content:
    post:
      tags: [文件系统]
      summary: 读取文件内容
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [文件系统]
      summary: 写入文件内容
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/mcp/servers:
    get:
      tags: [MCP]
      summary: 获取 MCP 服务器列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [MCP]
      summary: 创建 MCP 服务器
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/mcp/servers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [MCP]
      summary: 更新 MCP 服务器
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [MCP]
      summary: 删除 MCP 服务器
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/mcp/servers/{id}/toggle:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [MCP]
      summary: 启用或禁用 MCP 服务器
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/mcp/test-connection:
    post:
      tags: [MCP]
      summary: 测试 MCP 服务器连接
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/providers:
    get:
      tags: [Provider]
      summary: 获取 Provider 列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Provider]
      summary: 创建 Provider
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/providers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Provider]
      summary: 更新 Provider
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Provider]
      summary: 删除 Provider
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/assistants:
    get:
      tags: [Assistant]
      summary: 获取 Assistant 列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Assistant]
      summary: 创建 Assistant
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/assistants/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Assistant]
      summary: 获取 Assistant 详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Assistant]
      summary: 更新 Assistant
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Assistant]
      summary: 删除 Assistant
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/assistants/{id}/state:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Assistant]
      summary: 修改 Assistant 启用状态
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/cron/jobs:
    get:
      tags: [Cron]
      summary: 获取 Cron 任务列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Cron]
      summary: 创建 Cron 任务
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/cron/jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Cron]
      summary: 获取 Cron 任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Cron]
      summary: 更新 Cron 任务
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Cron]
      summary: 删除 Cron 任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/cron/jobs/{id}/run:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Cron]
      summary: 立即运行 Cron 任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/plugins:
    get:
      tags: [Channel]
      summary: 获取渠道插件状态
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/plugins/enable:
    post:
      tags: [Channel]
      summary: 启用渠道插件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/plugins/disable:
    post:
      tags: [Channel]
      summary: 禁用渠道插件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/plugins/test:
    post:
      tags: [Channel]
      summary: 测试渠道插件
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/pairings:
    get:
      tags: [Channel]
      summary: 获取待处理配对请求
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/pairings/approve:
    post:
      tags: [Channel]
      summary: 同意渠道用户配对
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/pairings/reject:
    post:
      tags: [Channel]
      summary: 拒绝渠道用户配对
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/users:
    get:
      tags: [Channel]
      summary: 获取已授权渠道用户
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/users/revoke:
    post:
      tags: [Channel]
      summary: 撤销渠道用户授权
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/channel/sessions:
    get:
      tags: [Channel]
      summary: 获取活动渠道会话
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/teams:
    get:
      tags: [Team]
      summary: 获取 Team 列表
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Team]
      summary: 创建 Team
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/teams/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Team]
      summary: 获取 Team 详情
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Team]
      summary: 删除 Team
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/teams/{id}/run-state:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Team]
      summary: 获取 Team 运行状态
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/teams/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Team]
      summary: 获取 Team 任务
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/teams/{id}/activity:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Team]
      summary: 获取 Team 活动
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/teams/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Team]
      summary: 向 Team 发送消息
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/settings:
    get:
      tags: [系统设置]
      summary: 获取系统设置
      responses:
        '200': { $ref: '#/components/responses/Success' }
