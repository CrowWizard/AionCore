name: AionCore Dev Windows x64

on:
  push:
    branches: [dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/aioncore-dev.yml"
  pull_request:
    branches: [dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/aioncore-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: Build AionCore Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aioncore-dev-windows-x64

      - name: Build AionCore Windows x64
        run: cargo build --release --target x86_64-pc-windows-msvc -p aionui-app

      - name: Upload AionCore Windows x64
        uses: actions/upload-artifact@v7
        with:
          name: aioncore-windows-x64
          path: target/x86_64-pc-windows-msvc/release/aioncore.exe
          if-no-files-found: error
          retention-days: 14
